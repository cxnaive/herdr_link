name: desktop-linux

on:
  push:
    branches: [feat/android-file-companion, main, dev]
    paths:
      - 'desktop/**'
      - '!desktop/**/*.md'
      - 'contracts/**'
      - 'internal/protocol/**'
      - 'internal/directterminal/**'
      - 'internal/transport/**'
      - 'internal/gateway/**'
      - 'internal/app/desktop_terminal.go'
      - 'internal/app/server.go'
      - '.github/workflows/desktop-linux.yml'
  pull_request:
    branches: [feat/android-file-companion, main, dev]
    paths:
      - 'desktop/**'
      - '!desktop/**/*.md'
      - 'contracts/**'
      - 'internal/protocol/**'
      - 'internal/directterminal/**'
      - 'internal/transport/**'
      - 'internal/gateway/**'
      - 'internal/app/desktop_terminal.go'
      - 'internal/app/server.go'
      - '.github/workflows/desktop-linux.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: desktop-linux-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.arch }} client tests and packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      HERDR_LINUX_ARCH: ${{ matrix.arch }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mygo/natives
          key: mygo-linux-${{ matrix.arch }}-${{ hashFiles('desktop/go.sum', 'desktop/third_party/mygo-terminal/mygo-plugin.json') }}
      - name: Install Linux runtime and isolated GUI test dependencies
        run: |
          python3 scripts/test_ci_deps.py
          ./scripts/install-ci-deps.sh
      - name: Format, vet and packaging tests
        run: |
          mapfile -t files < <(git ls-files -- '*.go')
          test -z "$(gofmt -l "${files[@]}")"
          go vet ./...
          python3 scripts/test_package_linux.py
      - name: Build same native client for Linux
        run: ./scripts/build-linux.sh
      - name: Test UI, bundled terminal, transport and file boundaries
        run: |
          export MYGO_GHOSTTY_VT="$PWD/build/linux-${{ matrix.arch }}/libghostty-vt.so"
          go test -count=1 -timeout=5m ./...
      - name: Test local discovery and direct enrollment against an isolated real Relay
        run: |
          mkdir -p build/local-relay
          go -C .. build -o "$PWD/build/local-relay/herdr-mobile-relay" ./cmd/herdr-mobile-relay
          HERDR_TEST_RELAY_BINARY="$PWD/build/local-relay/herdr-mobile-relay" \
            go test -race -count=1 -timeout=2m -run '^TestLocalActual' ./internal/relay
      - name: Native GTK and credential-store smoke test
        run: ./scripts/smoke-linux.sh
      - name: Verify Debian and portable packages, record source and hashes
        run: python3 scripts/package-linux.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: herdr-desktop-linux-${{ matrix.arch }}-${{ github.run_number }}
          path: desktop/build/artifacts-linux-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: herdr-desktop-linux-smoke-${{ matrix.arch }}-${{ github.run_number }}
          path: desktop/build/linux-smoke/
          if-no-files-found: ignore
          retention-days: 7
