name: build-artifacts

on:
  push:
    branches: [main, dev, feat/android-file-companion]
  pull_request:
    branches: [main, dev, feat/android-file-companion]
  workflow_dispatch:
    inputs:
      components:
        description: Components to build (manual runs can build both from one commit)
        type: choice
        default: all
        options: [all, native, android, release]

permissions:
  contents: read

concurrency:
  group: build-artifacts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select changed components
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      native: ${{ steps.paths.outputs.native }}
      android: ${{ steps.paths.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        uses: ./.github/actions/changed-components

  native-binaries:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    name: Native binaries (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux_amd64
            goos: linux
            goarch: amd64
          - target: linux_arm64
            goos: linux
            goarch: arm64
          - target: darwin_amd64
            goos: darwin
            goarch: amd64
          - target: darwin_arm64
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: true

      - name: Build and package binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TARGET: ${{ matrix.target }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          relay_version="$(jq -r '.relay.version' VERSION.json)"
          gateway_version="$(jq -r '.native_gateway.version' VERSION.json)"
          test "$relay_version" != null
          test "$gateway_version" != null

          output="dist/$TARGET"
          mkdir -p "$output"
          relay_binary="$output/herdr-mobile-relay"
          gateway_binary="$output/herdr-gateway"

          CGO_ENABLED=0 go build -mod=readonly -trimpath \
            -ldflags "-s -w -X main.version=$relay_version -X main.revision=$REVISION" \
            -o "$relay_binary" ./cmd/herdr-mobile-relay
          CGO_ENABLED=0 go build -mod=readonly -trimpath \
            -ldflags "-s -w -X main.version=$gateway_version -X main.revision=$REVISION" \
            -o "$gateway_binary" ./cmd/herdr-gateway

          jq -n \
            --arg target "$TARGET" \
            --arg goos "$GOOS" \
            --arg goarch "$GOARCH" \
            --arg revision "$REVISION" \
            --arg relay_version "$relay_version" \
            --arg gateway_version "$gateway_version" \
            --arg relay_sha256 "$(sha256sum "$relay_binary" | awk '{print $1}')" \
            --arg gateway_sha256 "$(sha256sum "$gateway_binary" | awk '{print $1}')" \
            '{schema: 1, target: $target, goos: $goos, goarch: $goarch, revision: $revision, components: {
              relay: {version: $relay_version, file: "herdr-mobile-relay", sha256: $relay_sha256},
              gateway: {version: $gateway_version, file: "herdr-gateway", sha256: $gateway_sha256}
            }}' > "$output/BUILD-INFO.json"

          (
            cd "$output"
            printf '%s  %s\n' \
              "$(sha256sum herdr-mobile-relay | awk '{print $1}')" "herdr-mobile-relay" \
              "$(sha256sum herdr-gateway | awk '{print $1}')" "herdr-gateway" \
              > SHA256SUMS.txt
            zip -X -9 "../herdr-native-binaries_${TARGET}.zip" \
              herdr-mobile-relay \
              herdr-gateway \
              BUILD-INFO.json SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-binaries-${{ matrix.target }}
          path: dist/herdr-native-binaries_${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 1

  native-bundles:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    name: Native Linux amd64 bundles and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: true

      - name: Package installable Relay and Gateway bundles
        run: scripts/package-native-release.sh dist/native-linux_amd64

      - name: Verify bundles and isolated startup and pairing
        run: python3 scripts/check-native-release.py dist/native-linux_amd64

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-bundles-linux_amd64
          path: dist/native-linux_amd64/
          if-no-files-found: error
          retention-days: 1

  android-apk:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    name: Android Debug and Release APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Test APK packaging and signing guards
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Build and test Android app
        working-directory: herdr-android
        run: ./gradlew --no-daemon -PsplitApks=true testDebugUnitTest assembleDebug assembleRelease assembleDebugAndroidTest lintDebug

      - name: Collect APKs without publishing a trusted signature
        run: python3 scripts/android-artifacts.py collect herdr-android/app/build/outputs/apk dist/android-ci

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apks-ci
          path: dist/android-ci/
          if-no-files-found: error
          retention-days: 1

  android-sign:
    name: Android APKs signed for existing installations
    needs: android-apk
    if: >-
      github.repository == 'cxnaive/herdr_link' &&
      github.ref == 'refs/heads/feat/android-file-companion' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: android-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install APK signing tools
        run: sdkmanager "build-tools;35.0.0"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apks-ci
          path: android-input

      - name: Sign and verify every APK with the existing certificate
        env:
          HERDR_ANDROID_KEYSTORE_BASE64: ${{ secrets.HERDR_ANDROID_KEYSTORE_BASE64 }}
          HERDR_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HERDR_ANDROID_KEYSTORE_PASSWORD }}
          HERDR_ANDROID_KEY_ALIAS: ${{ secrets.HERDR_ANDROID_KEY_ALIAS }}
          HERDR_ANDROID_KEY_PASSWORD: ${{ secrets.HERDR_ANDROID_KEY_PASSWORD }}
        run: python3 scripts/android-artifacts.py sign android-input dist/android-signed

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apks-signed
          path: dist/android-signed/
          if-no-files-found: error
          retention-days: 1

  desktop-linux-release:
    if: github.event_name == 'workflow_dispatch' && inputs.components == 'release'
    uses: ./.github/workflows/desktop-linux.yml

  desktop-windows-release:
    if: github.event_name == 'workflow_dispatch' && inputs.components == 'release'
    uses: ./.github/workflows/desktop-windows.yml

  project-release-bundle:
    name: Assemble Herdr Link release (exact CI bytes)
    if: github.event_name == 'workflow_dispatch' && inputs.components == 'release'
    needs: [native-bundles, android-sign, desktop-linux-release, desktop-windows-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/inputs
      - name: Verify source and assemble consistently named downloads
        run: python3 scripts/project_release.py assemble dist/inputs dist/herdr-link
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: herdr-link-release
          path: dist/herdr-link/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
