name: relay-windows

on:
  push:
    branches: [feat/android-file-companion, main, dev]
    paths:
      - 'cmd/herdr-mobile-relay/**'
      - 'cmd/herdr-gateway/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'tests/windows/**'
      - 'desktop/internal/relay/**'
      - 'desktop/go.*'
      - 'deploy/windows-relay/**'
      - 'scripts/package-windows-relay.ps1'
      - '.github/workflows/relay-windows.yml'
  pull_request:
    branches: [feat/android-file-companion, main, dev]
    paths:
      - 'cmd/herdr-mobile-relay/**'
      - 'cmd/herdr-gateway/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'tests/windows/**'
      - 'desktop/internal/relay/**'
      - 'desktop/go.*'
      - 'deploy/windows-relay/**'
      - 'scripts/package-windows-relay.ps1'
      - '.github/workflows/relay-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Native Windows Herdr and Relay integration
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - name: Validate formatting, Windows build and PowerShell syntax
        run: |
          $files = @(git ls-files '*.go' ':!:desktop/**')
          # Checkout may use CRLF. Compare normalized content to Git, in batches
          # below Windows' process command-line length limit.
          for ($i = 0; $i -lt $files.Count; $i += 40) {
            $batch = $files[$i..([Math]::Min($i+39,$files.Count-1))]
            gofmt -w @batch
            if ($LASTEXITCODE -ne 0) { throw 'Go formatting failed.' }
          }
          git -c core.safecrlf=false diff --exit-code -- '*.go' ':!:desktop/**'
          if ($LASTEXITCODE -ne 0) { throw 'Run gofmt before committing.' }
          go vet ./cmd/herdr-mobile-relay ./cmd/herdr-gateway ./internal/localipc ./internal/privatepath ./internal/processjob ./tests/windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows vet failed.' }
          Get-ChildItem deploy/windows-relay/*.ps1,scripts/package-windows-relay.ps1 | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
          New-Item -ItemType Directory dist/windows -Force | Out-Null
          $version = (Get-Content -Raw VERSION.json | ConvertFrom-Json).relay.version
          $revision = (git rev-parse HEAD).Trim()
          $env:CGO_ENABLED = '0'
          go build -mod=readonly -trimpath -ldflags "-s -w -X main.version=$version -X main.revision=$revision" -o dist/windows/herdr-mobile-relay.exe ./cmd/herdr-mobile-relay
          if ($LASTEXITCODE -ne 0) { throw 'Windows Relay build failed.' }
          go build -mod=readonly -trimpath -o dist/windows/herdr-gateway.exe ./cmd/herdr-gateway
          if ($LASTEXITCODE -ne 0) { throw 'Windows fixture Gateway build failed.' }
      - name: Windows pipe, ACL and process-tree tests
        run: |
          go test -count=1 -timeout=90s ./internal/localipc ./internal/privatepath ./internal/processjob
          if ($LASTEXITCODE -ne 0) { throw 'Windows platform boundary tests failed.' }
          go test -count=1 -timeout=90s -run '^TestWindowsCodex' ./internal/app
          if ($LASTEXITCODE -ne 0) { throw 'Windows Codex ownership tests failed.' }
          go test -count=1 ./internal/pathidentity
          if ($LASTEXITCODE -ne 0) { throw 'Windows path identity tests failed.' }
      - name: Install pinned real Herdr (entire ConPTY package)
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'herdr-0.9.5-windows.zip'
          Invoke-WebRequest 'https://github.com/herdrdev/herdr/releases/download/v0.9.5/herdr-windows-x86_64.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd2c6c9c971c43a0bfdde8c692a9a1a7a45c3e4807cd01ae45662b4734fac1cbf') { throw 'Herdr package checksum mismatch.' }
          $install = Join-Path $env:RUNNER_TEMP 'herdr-0.9.5'
          Expand-Archive $zip $install
          $binary = @(Get-ChildItem $install -Recurse -Filter herdr.exe)
          if ($binary.Count -ne 1) { throw 'Expected one Herdr executable in its complete package.' }
          "HERDR_WINDOWS_TEST_BIN=$($binary[0].FullName)" >> $env:GITHUB_ENV
          & $binary[0].FullName --version
          if ($LASTEXITCODE -ne 0) { throw 'Herdr failed to start.' }
      - name: Real Herdr, enrollment, E2EE client, terminal and reconnect
        env:
          HERDR_WINDOWS_INTEGRATION: '1'
        run: |
          go test -v -count=1 -timeout=6m ./tests/windows
          if ($LASTEXITCODE -ne 0) { throw 'Real Windows Relay integration failed; do not distribute the package.' }
      - name: Package tested Windows Relay preview
        run: ./scripts/package-windows-relay.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: herdr-relay-windows-amd64-${{ github.run_number }}
          path: dist/relay-windows-artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
